<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envoi en cours</title>
<style>
  :root { --bg:#fff; --fg:#202020; --muted:#808080; --line:#ddd; --accent:#db4c3f; --on:#fff; --err:#d1453b; --ok:#058527; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1e1e1e; --fg:#e8e8e8; --muted:#9a9a9a; --line:#3a3a3a; --accent:#ff7066; --on:#1e1e1e; --err:#ff8a80; --ok:#7fd49a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width:32rem; margin:0 auto; padding:14px 16px 3rem; }
  h1 { font-size:16px; margin:0 0 .4rem; } p { margin:.3rem 0; } .muted { color:var(--muted); }
  #state { font-size:15px; font-weight:600; margin:.9rem 0 .2rem; } .ok { color:var(--ok); } .err { color:var(--err); }
  a.button { display:block; text-align:center; margin-top:1.2rem; padding:.55rem .8rem; border-radius:6px; background:var(--accent); color:var(--on); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<main>
  <h1>Votre image</h1>
  <p id="state" role="status" aria-live="polite">Vérification…</p>
  <p id="detail" class="muted"></p>
  <a class="button" href="/">Retour à l'accueil d'Inkdrop</a>
</main>
<script>
const $ = (id) => document.getElementById(id);
const id = location.pathname.split("/").filter(Boolean).pop() || "";
function show(text, cls, detail) { $("state").textContent = text; $("state").className = cls || ""; $("detail").textContent = label + (detail || ""); }
const drawn = /^(\d{1,3}),(\d{1,3})$/.exec(new URLSearchParams(location.search).get("pi") || "");
const label = drawn ? `Pi-piquant : ${drawn[1]} décimales, angle ${drawn[2]}°. ` : "";
function hhmm(seconds) {
  return new Date(Date.now() + seconds * 1000).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
}
async function poll() {
  let r;
  try { r = await fetch("/api/status/" + encodeURIComponent(id)); } catch (e) { setTimeout(poll, 5000); return; }
  if (r.status === 404) return show("Envoi introuvable.", "err", "Le lien est incorrect, ou l'envoi est trop ancien.");
  const s = await r.json().catch(() => ({}));
  if (s.status === "shown") return show("Votre image a été affichée.", "ok", "Merci !");
  if (s.status === "failed" || s.status === "expired") return show("L'image n'a pas pu être affichée.", "err", "Vous pouvez en envoyer une autre.");
  show("Image reçue.", "ok", `Position ${s.position} dans la file — affichage vers ${hhmm(s.eta_seconds)}.`);
  setTimeout(poll, 5000);
}
poll();
</script>
</body>
</html>
